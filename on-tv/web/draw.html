<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Couch TV notepad</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#f2ead8;font:16px system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px}
canvas{width:100%;aspect-ratio:16/9;background:#14141a;border-radius:14px;touch-action:none;display:block}
.row{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:600;background:#222228;color:#f2ead8}
button.go{background:#ffb52e;color:#111}
#msg{min-height:22px;margin-top:10px;color:#bdb6a7}
</style></head><body><div class="wrap">
<canvas id="c"></canvas>
<div class="row"><button id="undo">Undo</button><button id="clear">Clear</button><button id="hide" class="go">Hide on TV</button></div>
<div id="msg"></div></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),msg=document.getElementById('msg');
var strokes=[],cur=null;
function tok(){try{return localStorage.getItem('couchtv.token')}catch(e){return null}}
function size(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);redraw()}
function redraw(){x.clearRect(0,0,c.width,c.height);x.lineCap='round';x.lineJoin='round';x.strokeStyle='#fff5e1';x.lineWidth=c.height*0.012;
strokes.forEach(function(s){x.beginPath();s.forEach(function(p,i){var px=p[0]*c.width,py=p[1]*c.height;if(i){x.lineTo(px,py)}else{x.moveTo(px,py)}});if(s.length==1){x.lineTo(s[0][0]*c.width+0.1,s[0][1]*c.height)}x.stroke()})}
function pt(e){var r=c.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}
c.addEventListener('pointerdown',function(e){c.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);redraw();e.preventDefault()});
c.addEventListener('pointermove',function(e){if(!cur)return;var p=pt(e),l=cur[cur.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<0.004)return;cur.push(p);redraw();e.preventDefault()});
function end(){if(!cur)return;cur=null;send()}
c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
function call(path,body){var t=tok();if(!t){msg.textContent='Pair this phone first: open the remote page and enter the code from the TV.';return}
fetch(path,{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){msg.textContent=r.ok?'':(j.error||j.message||('Error '+r.status))})}).catch(function(){msg.textContent='Cannot reach the TV.'})}
function send(){call('/api/draw',{strokes:strokes})}
document.getElementById('undo').onclick=function(){strokes.pop();redraw();if(strokes.length){send()}else{call('/api/draw/clear')}};
document.getElementById('clear').onclick=function(){strokes=[];redraw();call('/api/draw/clear')};
document.getElementById('hide').onclick=function(){call('/api/draw/clear')};
window.addEventListener('resize',size);size();
})();
</script></body></html>
