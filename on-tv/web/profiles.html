<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People and apps</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#f2ead8;font:16px system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
h2{margin:6px 0 10px;font-size:20px}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{padding:12px 16px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:#222228;color:#f2ead8}
button.on,button.go{background:#ffb52e;color:#111}
label{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #222}
input{width:22px;height:22px}
#msg,.hint{color:#bdb6a7;min-height:20px}
</style></head><body><div class="w">
<h2>Apps for each person</h2>
<div class="row" id="tabs"></div>
<p class="hint">Tick the apps this person sees on the TV home. Tick nothing to show every app.</p>
<div id="list"></div>
<div class="row"><button class="go" id="save">Save</button><button id="back">Back to remote</button></div>
<div id="msg"></div></div>
<script>
(function(){
var T=null;try{T=localStorage.getItem('couchtv.token')}catch(e){}
var msg=document.getElementById('msg'),tabs=document.getElementById('tabs'),list=document.getElementById('list');
var apps=[],prof={},people=[],cur=null;
function api(m,p,b){return fetch(p,{method:m,headers:{'Authorization':'Bearer '+T,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||j.message||('Error '+r.status));return j})})}
function draw(){
  tabs.innerHTML='';
  people.forEach(function(p){var b=document.createElement('button');b.textContent=p.name;if(p.id===cur)b.className='on';b.onclick=function(){cur=p.id;draw()};tabs.appendChild(b)});
  list.innerHTML='';
  var sel=prof[cur]||[];
  apps.forEach(function(a){var l=document.createElement('label'),c=document.createElement('input'),t=document.createElement('span');c.type='checkbox';c.value=a.package;c.checked=sel.indexOf(a.package)>=0;t.textContent=a.label;l.appendChild(c);l.appendChild(t);list.appendChild(l)});
}
document.getElementById('save').onclick=function(){
  var ch=[].slice.call(list.querySelectorAll('input:checked')).map(function(c){return c.value});
  api('POST','/api/profile-apps',{who:cur,apps:ch}).then(function(){prof[cur]=ch;msg.textContent=ch.length?'Saved.':'Saved: this person sees every app.'}).catch(function(e){msg.textContent=e.message});
};
document.getElementById('back').onclick=function(){location.href='/'};
if(!T){msg.textContent='Pair this phone first: open the remote page and enter the code from the TV.'}
else Promise.all([api('GET','/api/launchables'),api('GET','/api/profile-apps')]).then(function(r){
  apps=r[0].apps||[];prof=r[1].profiles||{};people=(r[1].people&&r[1].people.length)?r[1].people:[{id:'person1',name:'Person 1'},{id:'person2',name:'Person 2'}];
  cur=people[0].id;draw();
}).catch(function(e){msg.textContent=e.message});
})();
</script></body></html>
